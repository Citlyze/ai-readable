# pnpm ignored that field, rebuilt the lockfile without this override and
# pulled esbuild back to 0.27 (PR #8, 2026-10-03), which CI then refused.
overrides:
  # GHSA-g7r4-m6w7-qqqr (dev-server file read), fixed in 0.28.1. Reached
  # through tsup and vite.
  esbuild: ">=0.28.1"
  # GHSA-xjj6-f33q-929c, -4qv8-2p9j-2685, -f72v-6w45-q472, fixed in 7.30.1.
  # Reached through cheerio; the CLI never calls it, installs of the published
  # package already resolve a patched release, but the lockfile pinned 7.29.1.
  undici: "^7.30.1"
