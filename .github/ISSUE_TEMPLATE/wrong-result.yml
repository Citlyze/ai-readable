name: Wrong result
description: A check passed or failed when it should not have.
title: "[wrong result] "
labels: ["bug", "wrong-result"]
body:
  - type: input
    id: url
    attributes:
      label: URL
      description: The page you checked. If it is not public, attach the HTML instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: npx ai-readable https://example.com/pricing --render
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the terminal output or the `--json` report.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Which check is wrong, and why.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: output of `npx ai-readable --version`
