name: Recipe request or improvement
description: A framework or hosting setup that needs its own fix recipe.
title: "[recipe] "
labels: ["recipe"]
body:
  - type: input
    id: framework
    attributes:
      label: Framework or platform
      placeholder: SvelteKit, Nuxt, Webflow export, ...
    validations:
      required: true
  - type: textarea
    id: failing
    attributes:
      label: Which checks fail on a default project, and what fixed them for you
    validations:
      required: true
