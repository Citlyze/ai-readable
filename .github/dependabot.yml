version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors change the compiler; bump them by hand with the tsup dts build checked.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types track the oldest Node the package supports (engines), so a newer
      # major would let code use APIs that Node lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
