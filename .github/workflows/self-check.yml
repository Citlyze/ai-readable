name: Self-check

# Runs this repository's own Action against the site published on GitHub
# Pages: the landing page and the good fixture pages must stay green, the
# deliberately broken fixture pages must go red. The README's before/after
# is therefore always real, and the landing page is dogfooded.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FIXTURE_URL: https://citlyze.github.io/ai-readable

jobs:
  good-pages:
    name: Good pages stay green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          base-url: ${{ env.FIXTURE_URL }}
          paths: "/ /fixture/ /fixture/fixed/pricing/"
          comment: "false"
          source: local

  broken-pages:
    name: Broken pages go red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          base-url: ${{ env.FIXTURE_URL }}
          paths: "/fixture/pricing/ /fixture/blocked/ /fixture/noindex/"
          comment: "false"
          source: local
      - name: Assert the gate itself reported the failure
        if: steps.gate.outcome != 'failure' || steps.gate.outputs.failed != 'true'
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          FAILED: ${{ steps.gate.outputs.failed }}
          REGRESSIONS: ${{ steps.gate.outputs.regressions }}
        run: |
          echo "Expected the gate to fail on the broken fixture pages: outcome=$OUTCOME failed=$FAILED regressions=$REGRESSIONS" >&2
          exit 1
